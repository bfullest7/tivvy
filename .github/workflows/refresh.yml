name: Refresh data and publish app

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours; full refresh on the first run after 10:00 UTC each day
  workflow_dispatch:
    inputs:
      mode:
        description: "What to refresh"
        type: choice
        options: [full, auto, trending]
        default: full
        required: false
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # latest commit, so a queued run never publishes older data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build feed
        if: github.event_name != 'push'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: python pipeline/build_feed.py --mode "${{ github.event.inputs.mode || 'auto' }}"

      - name: Save data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Refresh data"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html app.js styles.css sw.js manifest.webmanifest icons config.json _site/
          # Version = fingerprint of the app's own files, so it changes only when
          # the app changes (not on every data refresh). Used for the file links
          # and for the "Update available" banner (version.json).
          v=$(cat index.html app.js styles.css | sha256sum | cut -c1-10)
          sed -i "s#app.js\"#app.js?v=$v\"#; s#styles.css\"#styles.css?v=$v\"#" _site/index.html
          sed -i "s#<meta name=\"app-version\" content=\"dev\">#<meta name=\"app-version\" content=\"$v\">#" _site/index.html
          echo "{\"version\": \"$v\"}" > _site/version.json
          grep -n "?v=" _site/index.html
          mkdir -p _site/data && cp data/feed.json _site/data/ 2>/dev/null || true
          cp -r data/cast _site/data/ 2>/dev/null || true  # cast, loaded when a title's screen opens

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # Size alarm: after publishing (so nothing is held back), fail the run if the file every
      # phone downloads has grown past the limit in config.json. GitHub then emails a
      # "workflow failed" notice; the data and app are already live.
      - name: Check download size and services
        if: github.event_name != 'push'
        run: |
          python - <<'PY'
          import gzip, json, sys
          limit = json.load(open("config.json"))["refresh"].get("feed_size_alarm_mb", 2.5)
          raw = open("data/feed.json", "rb").read()
          mb = len(gzip.compress(raw, 9)) / 1e6
          print(f"feed.json: {len(raw) / 1e6:.1f} MB, {mb:.2f} MB compressed (alarm at {limit} MB)")
          failed = False
          if mb > limit:
              print(f"::error title=Data file too big::feed.json is {mb:.2f} MB compressed, over the {limit} MB limit. Ask Claude to find what grew and trim it.")
              failed = True
          # service alarms from this run's morning rebuild (a service losing many titles, or
          # Hulu and Disney+ suddenly sharing many more titles)
          try:
              alerts = json.load(open("data/cache/alerts.json"))
          except Exception:
              alerts = []
          for a in alerts:
              print(f"::error title=Streaming service change::{a} Ask Claude to check the services.")
              failed = True
          sys.exit(1 if failed else 0)
          PY
